<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - DriveIndia</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="login">
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🚗 DriveIndia</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Login or create your account to start booking</p>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-login">Login</button>
      <button class="tab-btn" id="tab-register">Register</button>
    </div>
    <div id="login-form">
      <div class="alert alert-err" id="login-alert"></div>
      <div class="form-group"><label>Email</label><input type="email" id="l-email" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••"/></div>
      <button class="btn btn-primary btn-full" id="login-btn">Login →</button>
      <div class="auth-switch">No account? <a href="#" id="goto-reg">Register here</a></div>
    </div>
    <div id="register-form" style="display:none">
      <div class="alert alert-err" id="reg-alert"></div>
      <div class="form-group"><label>Full Name</label><input type="text" id="r-name" placeholder="Ravi Kumar"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="r-email" placeholder="ravi@example.com"/></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="r-phone" placeholder="+91 9876543210"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="r-pass" placeholder="Min. 6 characters"/></div>
      <button class="btn btn-primary btn-full" id="reg-btn">Create Account →</button>
      <div class="auth-switch">Have account? <a href="#" id="goto-login">Login here</a></div>
    </div>
    <div style="margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--border);text-align:center">
      <a href="admin-login.html" style="color:var(--muted);font-size:.82rem">Admin Login →</a>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      <a href="index.html" style="color:var(--muted);font-size:.82rem">← Back to Home</a>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
