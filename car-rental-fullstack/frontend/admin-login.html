<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - DriveIndia</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="admin-login">
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo" style="color:#e84040">🛡️ Admin Portal</div>
    <h2>Admin Login</h2>
    <p class="subtitle">Restricted access - authorised personnel only</p>
    <div class="alert alert-err" id="admin-alert"></div>
    <div class="form-group"><label>Admin Email</label><input type="email" id="a-email" placeholder="admin@driveindia.com"/></div>
    <div class="form-group"><label>Password</label><input type="password" id="a-pass" placeholder="......."/></div>
    <button class="btn btn-primary btn-full" id="admin-login-btn" style="background:#e84040">🛡️ Access Dashboard →</button>
    <div style="margin-top:1.5rem;padding:.9rem;background:var(--card);border:1px solid var(--border);border-radius:8px;">
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:.3rem">Demo Credentials</div>
      <div style="font-size:.85rem">Email: <code style="color:var(--gold)">admin@driveindia.com</code></div>
      <div style="font-size:.85rem">Password: <code style="color:var(--gold)">Admin@123</code></div>
    </div>
    <div style="margin-top:1.2rem;text-align:center">
      <a href="index.html" style="color:var(--muted);font-size:.82rem">← Back to Home</a>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      <a href="login.html" style="color:var(--muted);font-size:.82rem">User Login</a>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
