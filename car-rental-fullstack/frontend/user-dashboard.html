<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Dashboard - DriveIndia</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="user-dashboard">
<nav>
  <div class="nav-logo">🚗 <span>Drive</span>India</div>
  <div class="nav-links">
    <span id="user-name" style="color:var(--muted);font-size:.9rem"></span>
    <button class="btn-nav" id="user-logout">Logout</button>
  </div>
</nav>
<div class="dash-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Menu</div>
      <a href="#cars-section" class="sidebar-link active">🚗 Browse Cars</a>
      <a href="#bookings-section" class="sidebar-link">📋 My Bookings</a>
      <a href="index.html" class="sidebar-link">🏠 Home</a>
    </div>
  </aside>
  <main class="dash-main">
    <section id="cars-section">
      <div class="dash-header"><h1>BROWSE CARS</h1><p>Select a car and choose your dates to book.</p></div>
      <div class="cars-grid" id="cars-list"></div>
    </section>
    <section id="bookings-section" style="margin-top:3rem">
      <div class="dash-header"><h1>MY BOOKINGS</h1><p>Track the status of all your rental bookings.</p></div>
      <div id="my-bookings-table"></div>
    </section>
  </main>
</div>
<div class="modal-overlay" id="booking-modal">
  <div class="modal">
    <h3 id="modal-car-name">Car Name</h3>
    <p class="sub">Select pickup and return dates to calculate total cost.</p>
    <div class="date-row">
      <div class="form-group"><label>📅 Pickup Date</label><input type="date" id="book-pickup"/></div>
      <div class="form-group"><label>📅 Return Date</label><input type="date" id="book-return"/></div>
    </div>
    <div class="total-box"><span class="lbl">Estimated Total</span><span class="amt" id="book-total">—</span></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="confirm-booking-btn" onclick="submitBooking()">✅ Confirm Booking</button>
      <button class="btn btn-outline" onclick="closeBooking()">Cancel</button>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
